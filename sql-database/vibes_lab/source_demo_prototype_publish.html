<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIBES LAB | Enterprise AI Curator Prototype</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"DM Sans"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: {
                        vibesBlack: '#0a0a0a',
                        vibesWhite: '#ffffff',
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f5f5f5; color: #0a0a0a; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
        .terminal-scroll::-webkit-scrollbar-thumb { background: #333; }
        
        .grid-bg {
            background-size: 20px 20px;
            background-image: 
                linear-gradient(to right, #f0f0f0 1px, transparent 1px),
                linear-gradient(to bottom, #f0f0f0 1px, transparent 1px);
        }

        .loader {
            border: 2px solid #e5e7eb; border-top: 2px solid #0a0a0a;
            border-radius: 50%; width: 16px; height: 16px;
            animation: spin 1s linear infinite; display: inline-block;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .playing-eq span {
            display: inline-block;
            width: 3px;
            height: 12px;
            background-color: #0a0a0a;
            margin: 0 1px;
            animation: eq 1s ease-in-out infinite;
        }
        .playing-eq span:nth-child(2) { animation-delay: 0.2s; }
        .playing-eq span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes eq {
            0%, 100% { height: 4px; }
            50% { height: 12px; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            // Input State
            const [brandName, setBrandName] = useState("VIBES FLAGSHIP STORE");
            const [brandType, setBrandType] = useState("Luxury Retail");
            const [hours, setHours] = useState("10:00 - 22:00");
            const [vibe, setVibe] = useState("Elegant, modern, exclusive, increasing energy towards evening");
            const [slotCount, setSlotCount] = useState(3);
            
            // System State
            const [isGenerating, setIsGenerating] = useState(false);
            const [activeTab, setActiveTab] = useState("timeline");
            const [result, setResult] = useState(null);
            const [logs, setLogs] = useState([]);
            
            // Audio State
            const [playingTrack, setPlayingTrack] = useState(null);
            const audioRef = useRef(null);

            // API Settings
            const [useLiveApi, setUseLiveApi] = useState(false);
            const [apiKey, setApiKey] = useState("");
            const logsEndRef = useRef(null);

            useEffect(() => {
                if(logsEndRef.current) {
                    logsEndRef.current.scrollIntoView({ behavior: "smooth" });
                }
            }, [logs]);

            const addLog = (msg, delay = 0) => {
                return new Promise(resolve => {
                    setTimeout(() => {
                        setLogs(prev => [...prev, `[${new Date().toISOString().split('T')[1].slice(0,8)}] ${msg}`]);
                        resolve();
                    }, delay);
                });
            };

            // "Surprise Me" Randomizer
            const handleSurpriseMe = (e) => {
                e.preventDefault();
                const ideas = [
                    { name: "Neon Tokyo", type: "Cyberpunk Lounge", hours: "18:00 - 02:00", vibe: "Synthwave, retrowave, dark futuristic, high energy", slots: 4 },
                    { name: "Zenith Garden", type: "Luxury Spa", hours: "09:00 - 20:00", vibe: "Ambient, nature sounds, healing, extremely calm", slots: 3 },
                    { name: "The Vintage Grind", type: "Retro Coffee", hours: "07:00 - 17:00", vibe: "70s soul, jazz, warm, nostalgic, acoustic", slots: 3 },
                    { name: "Apex Athletics", type: "Modern Gym", hours: "06:00 - 22:00", vibe: "EDM, high BPM, aggressive, motivating, upbeat", slots: 5 },
                    { name: "Midnight Noir", type: "Speakeasy Bar", hours: "19:00 - 01:00", vibe: "Dark jazz, blues, mysterious, smoky, slow tempo", slots: 2 }
                ];
                const random = ideas[Math.floor(Math.random() * ideas.length)];
                setBrandName(random.name);
                setBrandType(random.type);
                setHours(random.hours);
                setVibe(random.vibe);
                setSlotCount(random.slots);
                addLog(`SYSTEM: Loaded AI preset profile: ${random.name}`);
            };

            // Audio Player Toggle
            const togglePlay = (track) => {
                if (!track.previewUrl) {
                    alert("Preview not available for this track.");
                    return;
                }
                if (playingTrack === track.previewUrl) {
                    audioRef.current.pause();
                    setPlayingTrack(null);
                } else {
                    audioRef.current.src = track.previewUrl;
                    audioRef.current.play();
                    setPlayingTrack(track.previewUrl);
                }
            };

            // Fetch Real Tracks with Audio Preview
            const fetchRealTracks = async (searchQuery) => {
                try {
                    const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(searchQuery)}&entity=song&limit=3`);
                    const data = await res.json();
                    if (data.results && data.results.length > 0) {
                        return data.results.map(t => ({ 
                            title: t.trackName, 
                            artist: t.artistName,
                            previewUrl: t.previewUrl // 30-sec audio clip
                        }));
                    }
                } catch (e) {
                    console.warn("iTunes API failed");
                }
                return []; // fallback empty
            };

            const parseTime = (t) => {
                const [h, m] = t.split(':');
                return parseInt(h) * 60 + parseInt(m);
            };

            const formatTime = (mins) => {
                const h = Math.floor(mins / 60) % 24;
                const m = Math.floor(mins % 60);
                return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
            };

            const generateMockPlan = async () => {
                await addLog("INIT: Starting AI Curation Pipeline...", 0);
                await addLog(`AI_ENGINE: Parsing semantic vibe: '${vibe}'...`, 400);
                await addLog(`CALC: Dynamically splitting hours (${hours}) into ${slotCount} operational phases...`, 300);
                await addLog("DB: Executing real-time semantic search via iTunes Audio Engine...", 500);
                
                const times = hours.split('-');
                const startMins = parseTime(times[0] ? times[0].trim() : "08:00");
                let endMins = parseTime(times[1] ? times[1].trim() : "22:00");
                if (endMins <= startMins) endMins += 24 * 60; // Overnight shift
                
                const slotDuration = (endMins - startMins) / slotCount;
                const keyword = vibe.split(',')[0].trim() || brandType;
                const searchModifiers = ["chill", "acoustic", "groove", "upbeat", "intense"];
                
                let plan = [];

                for (let i = 0; i < slotCount; i++) {
                    const sTime = startMins + (i * slotDuration);
                    const eTime = sTime + slotDuration;
                    const timeSlot = `${formatTime(sTime)} - ${formatTime(eTime)}`;
                    
                    const progress = slotCount > 1 ? (i / (slotCount - 1)) : 0.5; // 0 to 1
                    const targetBPM = Math.floor(75 + (progress * 50)); 
                    const valence = Math.floor(40 + (progress * 45));
                    const arousal = Math.floor(30 + (progress * 60));
                    
                    const modifier = searchModifiers[Math.min(i, searchModifiers.length - 1)];
                    const tracks = await fetchRealTracks(`${keyword} ${modifier}`);
                    await addLog(`DB: Fetched ${tracks.length} real audio tracks for Phase ${i+1}.`, 300);

                    plan.push({
                        timeSlot, 
                        mood: `Phase ${i+1}: ${brandName}`, 
                        targetBPM,
                        valence, arousal,
                        description: `Automatically mapped transition for ${timeSlot}. Algorithm adjusts BPM to ${targetBPM} aligning with the '${vibe}' trajectory.`,
                        recommendedTracks: tracks
                    });
                }
                
                await addLog("LLM: Structuring deterministic JSON payload...", 600);
                return { success: true, plan };
            };

            const generateLivePlan = async () => {
                if (!apiKey) throw new Error("Missing OpenAI API Key");
                
                await addLog("INIT: Connecting to Live OpenAI API (gpt-4o-mini)...", 0);
                await addLog(`PROMPT: Instructing AI to generate EXACTLY ${slotCount} time slots...`, 300);
                
                const response = await fetch("https://api.openai.com/v1/chat/completions", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${apiKey}` },
                    body: JSON.stringify({
                        model: "gpt-4o-mini",
                        response_format: { type: "json_object" },
                        messages: [
                            {
                                role: "system",
                                content: `You are an expert Music Director. Generate a daily music plan. Output ONLY valid JSON containing an array named 'plan' with EXACTLY ${slotCount} objects. Each object requires: 'timeSlot' (string based on operating hours), 'mood' (string), 'targetBPM' (number), 'description' (string), 'valence' (number 0-100), 'arousal' (number 0-100), and 'recommendedTracks' (an array containing 3 objects with 'title' (string) and 'artist' (string) of REAL existing songs that fit the vibe).`
                            },
                            { role: "user", content: `Brand: ${brandName} | Type: ${brandType} | Hours: ${hours} | Vibe: ${vibe}` }
                        ],
                        temperature: 0.7
                    })
                });

                await addLog("NETWORK: Awaiting LLM inference completion...", 500);
                if (!response.ok) throw new Error("API Request Failed");
                const data = await response.json();
                
                await addLog("PARSER: Validating JSON schema...", 200);
                const content = JSON.parse(data.choices[0].message.content);
                
                // Hydrate with Real Audio URLs
                await addLog("HYDRATION: Fetching playable audio URLs for AI's recommended tracks...", 200);
                for (let slot of content.plan) {
                    if (slot.recommendedTracks) {
                        for (let track of slot.recommendedTracks) {
                            try {
                                const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(track.title + ' ' + track.artist)}&entity=song&limit=1`);
                                const tData = await res.json();
                                if (tData.results && tData.results.length > 0) {
                                    track.previewUrl = tData.results[0].previewUrl;
                                }
                            } catch(e) {}
                        }
                    }
                }

                return { success: true, plan: content.plan };
            };

            const handleGenerate = async (e) => {
                e.preventDefault();
                setIsGenerating(true);
                setResult(null);
                setLogs([]);
                setPlayingTrack(null);
                if(audioRef.current) audioRef.current.pause();

                try {
                    let data = useLiveApi ? await generateLivePlan() : await generateMockPlan();
                    await addLog("SUCCESS: Data rendered to UI components.", 200);
                    setResult(data);
                } catch (err) {
                    await addLog(`ERROR: ${err.message}`, 0);
                } finally {
                    setIsGenerating(false);
                }
            };

            return (
                <div className="min-h-screen flex flex-col font-sans">
                    {/* Hidden Audio Element */}
                    <audio ref={audioRef} onEnded={() => setPlayingTrack(null)} />

                    {/* Header */}
                    <header className="bg-white border-b border-gray-200 px-6 py-3 flex justify-between items-center sticky top-0 z-10 shadow-sm">
                        <div className="flex items-center gap-4">
                            <h1 className="text-xl font-extrabold tracking-widest uppercase">VIBES LAB</h1>
                            <div className="h-4 w-px bg-gray-300"></div>
                            <span className="text-xs font-bold text-gray-500 uppercase tracking-widest hidden md:block">Enterprise Architecture</span>
                        </div>
                        <div className="flex items-center gap-6">
                            <label className="flex items-center cursor-pointer">
                                <div className="relative">
                                    <input type="checkbox" className="sr-only" checked={useLiveApi} onChange={() => setUseLiveApi(!useLiveApi)} />
                                    <div className={`block w-10 h-6 rounded-full transition ${useLiveApi ? 'bg-black' : 'bg-gray-300'}`}></div>
                                    <div className={`dot absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition transform ${useLiveApi ? 'translate-x-4' : ''}`}></div>
                                </div>
                                <div className="ml-2 text-xs font-bold uppercase">Live API</div>
                            </label>
                        </div>
                    </header>

                    {/* Developer API Input */}
                    {useLiveApi && (
                        <div className="bg-vibesBlack text-white px-6 py-2 flex justify-center items-center gap-4 border-b border-gray-800 shadow-inner">
                            <i className="fa-solid fa-key text-gray-400 text-xs"></i>
                            <input 
                                type="password" 
                                placeholder="Paste OpenAI API Key (sk-...)" 
                                value={apiKey}
                                onChange={(e) => setApiKey(e.target.value)}
                                className="bg-transparent border-b border-gray-600 text-xs font-mono w-96 px-2 py-1 focus:outline-none focus:border-white transition"
                            />
                        </div>
                    )}

                    <main className="flex-1 p-6 grid grid-cols-1 xl:grid-cols-12 gap-6 max-w-[1800px] mx-auto w-full">
                        
                        {/* LEFT COLUMN: Input & Terminal */}
                        <div className="xl:col-span-4 flex flex-col gap-6">
                            
                            {/* Input Form */}
                            <div className="bg-white p-6 border border-gray-200 rounded-sm shadow-sm relative">
                                <div className="flex justify-between items-center mb-6 border-b border-gray-100 pb-2">
                                    <h2 className="text-sm font-extrabold uppercase tracking-wider">1. Brand Identity</h2>
                                    <button onClick={handleSurpriseMe} className="text-xs font-bold text-gray-500 hover:text-black transition uppercase bg-gray-100 px-2 py-1 rounded">
                                        <i className="fa-solid fa-dice mr-1"></i> Randomize
                                    </button>
                                </div>
                                
                                <form onSubmit={handleGenerate} className="space-y-4">
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-[10px] font-bold text-gray-500 uppercase mb-1">Brand Name</label>
                                            <input type="text" value={brandName} onChange={(e) => setBrandName(e.target.value)} className="w-full border border-gray-300 rounded-sm p-2 text-sm focus:border-black focus:outline-none transition" required />
                                        </div>
                                        <div>
                                            <label className="block text-[10px] font-bold text-gray-500 uppercase mb-1">Venue Type</label>
                                            <input type="text" value={brandType} onChange={(e) => setBrandType(e.target.value)} className="w-full border border-gray-300 rounded-sm p-2 text-sm focus:border-black focus:outline-none transition" required />
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-3 gap-4">
                                        <div className="col-span-2">
                                            <label className="block text-[10px] font-bold text-gray-500 uppercase mb-1">Operating Hours</label>
                                            <input type="text" value={hours} onChange={(e) => setHours(e.target.value)} className="w-full border border-gray-300 rounded-sm p-2 text-sm focus:border-black focus:outline-none transition" required />
                                        </div>
                                        <div>
                                            <label className="block text-[10px] font-bold text-gray-500 uppercase mb-1">Time Slots</label>
                                            <input type="number" min="1" max="8" value={slotCount} onChange={(e) => setSlotCount(Number(e.target.value))} className="w-full border border-gray-300 rounded-sm p-2 text-sm focus:border-black focus:outline-none transition text-center" required />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-[10px] font-bold text-gray-500 uppercase mb-1">Atmosphere / Semantic Vibe</label>
                                        <textarea value={vibe} onChange={(e) => setVibe(e.target.value)} rows="3" className="w-full border border-gray-300 rounded-sm p-2 text-sm focus:border-black focus:outline-none resize-none transition" required></textarea>
                                    </div>
                                    
                                    <button type="submit" disabled={isGenerating} className={`w-full py-3 mt-2 text-white text-xs font-bold uppercase tracking-widest rounded-sm transition ${isGenerating ? 'bg-gray-400' : 'bg-black hover:bg-gray-800'}`}>
                                        {isGenerating ? <span className="loader border-gray-400 border-top-white"></span> : "Execute AI Curation"}
                                    </button>
                                </form>
                            </div>

                            {/* Execution Terminal */}
                            <div className="bg-vibesBlack flex-1 rounded-sm border border-gray-800 flex flex-col min-h-[250px] shadow-lg overflow-hidden">
                                <div className="bg-gray-900 px-4 py-2 border-b border-gray-800 flex justify-between items-center">
                                    <span className="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Backend Execution Trace</span>
                                    <div className="flex gap-1.5"><div className="w-2 h-2 rounded-full bg-red-500"></div><div className="w-2 h-2 rounded-full bg-yellow-500"></div><div className="w-2 h-2 rounded-full bg-green-500"></div></div>
                                </div>
                                <div className="p-4 text-[11px] font-mono text-green-400 overflow-y-auto flex-1 terminal-scroll space-y-1">
                                    {logs.length === 0 && <span className="text-gray-600">Awaiting system input...</span>}
                                    {logs.map((log, i) => (
                                        <div key={i} className={`${log.includes('ERROR') ? 'text-red-400' : log.includes('SUCCESS') ? 'text-white font-bold' : ''}`}>
                                            {log}
                                        </div>
                                    ))}
                                    {isGenerating && <div className="animate-pulse">_</div>}
                                    <div ref={logsEndRef} />
                                </div>
                            </div>
                        </div>

                        {/* RIGHT COLUMN: Results */}
                        <div className="xl:col-span-8 flex flex-col h-full min-h-[600px]">
                            <div className="bg-white border border-gray-200 rounded-sm flex flex-col h-full shadow-sm">
                                
                                {/* Tabs */}
                                <div className="flex border-b border-gray-200 bg-gray-50">
                                    <button onClick={() => setActiveTab("timeline")} className={`flex-1 py-3 text-xs font-bold uppercase tracking-wider transition ${activeTab === "timeline" ? "border-b-2 border-black bg-white text-black" : "text-gray-400 hover:text-black"}`}>
                                        <i className="fa-solid fa-bars-staggered mr-2"></i> Client Timeline
                                    </button>
                                    <button onClick={() => setActiveTab("emotion")} className={`flex-1 py-3 text-xs font-bold uppercase tracking-wider transition ${activeTab === "emotion" ? "border-b-2 border-black bg-white text-black" : "text-gray-400 hover:text-black"}`}>
                                        <i className="fa-solid fa-chart-line mr-2"></i> Emotion Map (AI)
                                    </button>
                                    <button onClick={() => setActiveTab("json")} className={`flex-1 py-3 text-xs font-bold uppercase tracking-wider transition ${activeTab === "json" ? "bg-black text-white" : "text-gray-400 hover:bg-gray-200"}`}>
                                        <i className="fa-solid fa-code mr-2"></i> Strict JSON
                                    </button>
                                </div>

                                {/* Content */}
                                <div className="flex-1 overflow-y-auto grid-bg bg-opacity-50">
                                    {!result && !isGenerating ? (
                                        <div className="h-full flex flex-col items-center justify-center text-gray-300">
                                            <i className="fa-solid fa-diagram-project text-5xl mb-4"></i>
                                            <p className="text-sm font-bold uppercase tracking-widest text-gray-400">Architecture Idle</p>
                                        </div>
                                    ) : (
                                        <div className="p-8">
                                            
                                            {/* TIMELINE TAB */}
                                            {activeTab === "timeline" && result && (
                                                <div className="max-w-2xl mx-auto">
                                                    {result.plan.map((item, index) => (
                                                        <div key={index} className="flex gap-6 mb-8 group">
                                                            <div className="w-24 md:w-32 text-right pt-1">
                                                                <span className="text-[10px] md:text-xs font-extrabold font-mono border-b border-black pb-1">{item.timeSlot}</span>
                                                            </div>
                                                            <div className="relative pb-8 border-l border-gray-300 pl-6 flex-1">
                                                                <div className="absolute -left-[5px] top-1.5 w-2 h-2 bg-black rounded-full ring-4 ring-white group-hover:scale-150 transition-transform"></div>
                                                                <div className="bg-white border border-gray-200 shadow-sm rounded-sm overflow-hidden transition-shadow hover:shadow-md">
                                                                    
                                                                    {/* Mood Header */}
                                                                    <div className="p-4 md:p-5">
                                                                        <div className="flex justify-between items-start mb-2">
                                                                            <h3 className="text-base md:text-lg font-bold uppercase tracking-wide pr-4">{item.mood}</h3>
                                                                            <div className="text-right shrink-0">
                                                                                <span className="text-[10px] text-gray-400 font-bold uppercase block">BPM target</span>
                                                                                <span className="text-xl font-extrabold font-mono">{item.targetBPM}</span>
                                                                            </div>
                                                                        </div>
                                                                        <p className="text-gray-600 text-xs md:text-sm leading-relaxed">{item.description}</p>
                                                                    </div>

                                                                    {/* Recommended Tracks Section */}
                                                                    {item.recommendedTracks && item.recommendedTracks.length > 0 && (
                                                                        <div className="bg-gray-50 border-t border-gray-100 p-4">
                                                                            <span className="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-3 flex items-center gap-2">
                                                                                <i className="fa-solid fa-music"></i> Audio Engine Results
                                                                            </span>
                                                                            <ul className="space-y-2">
                                                                                {item.recommendedTracks.map((track, tIdx) => {
                                                                                    const isPlaying = playingTrack === track.previewUrl;
                                                                                    const canPlay = !!track.previewUrl;
                                                                                    return (
                                                                                    <li 
                                                                                        key={tIdx} 
                                                                                        onClick={() => canPlay && togglePlay(track)}
                                                                                        className={`flex items-center gap-3 bg-white border rounded p-2 transition ${canPlay ? 'cursor-pointer hover:border-black group/track' : 'opacity-50 cursor-not-allowed border-gray-200'}`}
                                                                                    >
                                                                                        <div className={`w-8 h-8 rounded flex items-center justify-center transition-colors ${isPlaying ? 'bg-black text-white' : 'bg-gray-100 text-gray-400 group-hover/track:bg-black group-hover/track:text-white'}`}>
                                                                                            {isPlaying ? (
                                                                                                <div className="playing-eq flex"><span></span><span></span><span></span></div>
                                                                                            ) : (
                                                                                                <i className={`fa-solid ${canPlay ? 'fa-play pl-0.5' : 'fa-ban'} text-xs`}></i>
                                                                                            )}
                                                                                        </div>
                                                                                        <div className="flex-1 truncate">
                                                                                            <span className={`text-sm font-bold block truncate ${isPlaying ? 'text-black' : 'text-gray-800'}`}>{track.title}</span>
                                                                                            <span className="text-[10px] text-gray-500 block truncate uppercase tracking-wider">{track.artist}</span>
                                                                                        </div>
                                                                                    </li>
                                                                                )})}
                                                                            </ul>
                                                                        </div>
                                                                    )}
                                                                    
                                                                </div>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}

                                            {/* EMOTION MAP TAB */}
                                            {activeTab === "emotion" && result && (
                                                <div className="max-w-3xl mx-auto h-[500px] flex flex-col">
                                                    <div className="mb-6 text-center">
                                                        <h3 className="text-sm font-extrabold uppercase tracking-widest">Valence-Arousal Psychology Mapping</h3>
                                                        <p className="text-xs text-gray-500 mt-1">AI plots music attributes based on high-level acoustic feature extraction.</p>
                                                    </div>
                                                    
                                                    {/* The Quadrant Graph */}
                                                    <div className="relative flex-1 border-2 border-gray-200 bg-white shadow-sm rounded-sm">
                                                        <div className="absolute top-0 bottom-0 left-1/2 w-px bg-gray-300"></div>
                                                        <div className="absolute left-0 right-0 top-1/2 h-px bg-gray-300"></div>
                                                        
                                                        <span className="absolute top-4 left-1/2 -translate-x-1/2 text-[10px] font-bold text-gray-400 uppercase bg-white px-2">High Energy (Excited)</span>
                                                        <span className="absolute bottom-4 left-1/2 -translate-x-1/2 text-[10px] font-bold text-gray-400 uppercase bg-white px-2">Low Energy (Calm)</span>
                                                        <span className="absolute top-1/2 right-4 -translate-y-1/2 text-[10px] font-bold text-gray-400 uppercase bg-white px-2 hidden sm:block">Positive (Happy)</span>
                                                        <span className="absolute top-1/2 left-4 -translate-y-1/2 text-[10px] font-bold text-gray-400 uppercase bg-white px-2 hidden sm:block">Negative (Sad/Anxious)</span>

                                                        {result.plan.map((item, i) => (
                                                            <div 
                                                                key={i} 
                                                                className="absolute group"
                                                                style={{ left: `${item.valence}%`, bottom: `${item.arousal}%`, transform: 'translate(-50%, 50%)' }}
                                                            >
                                                                <div className="w-5 h-5 bg-black rounded-full shadow-[0_0_0_4px_rgba(0,0,0,0.1)] cursor-pointer hover:scale-125 transition-transform flex items-center justify-center text-white text-[10px] font-bold">
                                                                    {i+1}
                                                                </div>
                                                                <div className="absolute top-8 left-1/2 -translate-x-1/2 w-36 bg-black text-white text-[10px] p-2 rounded-sm text-center opacity-0 group-hover:opacity-100 transition-opacity z-10 pointer-events-none shadow-lg">
                                                                    <strong className="block border-b border-gray-700 pb-1 mb-1">Slot {i+1}: {item.timeSlot}</strong>
                                                                    <div className="mb-1">{item.mood}</div>
                                                                    <div className="text-gray-400 font-mono">V:{item.valence} | A:{item.arousal}</div>
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            )}

                                            {/* JSON TAB */}
                                            {activeTab === "json" && result && (
                                                <div className="h-[500px] bg-vibesBlack p-6 overflow-auto rounded-sm terminal-scroll">
                                                    <pre className="text-gray-300 font-mono text-[11px] leading-relaxed">
                                                        {JSON.stringify(result, null, 2)}
                                                    </pre>
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
